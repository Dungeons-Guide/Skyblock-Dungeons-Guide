plugins {
    id "signing"
    id "idea"
    id "java"
    id "dev.architectury.loom-no-remap"
}

version =  "4.0.0-beta13.2"
group = "kr.syeyoung.dungeonsguide"

base {
    archivesName = "dungeonsguide"
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(25))
}

repositories {
    mavenCentral()
    maven {
        url "https://jitpack.io/"
        content {
            includeGroupByRegex("(com|io)\\.github\\..+")
        }
    }
    maven { url "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }
}

configurations {
    bundled
    implementation.extendsFrom bundled

    remappedMod {
        canBeConsumed = true
        canBeResolved = false
    }
    unmappedMod {
        canBeConsumed = true
        canBeResolved = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:26.1.2"
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2"

    implementation "org.jetbrains:annotations-java5:19.0.0"

    bundled("org.java-websocket:Java-WebSocket:1.5.1") {
        exclude group: "org.json", module: "json"
        exclude group: "org.slf4j" // provided by minecraft
    }
    bundled 'com.github.Dungeons-Guide:DiscordIPC:d403df89'
    bundled "com.twelvemonkeys.imageio:imageio-bmp:3.7.0"
    bundled 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    bundled 'com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:2.18.1'
    bundled "org.json:json:20240303" // used to be provided via loader

    compileOnly "org.projectlombok:lombok:1.18.48"
    annotationProcessor "org.projectlombok:lombok:1.18.48"

    testCompileOnly "org.projectlombok:lombok:1.18.48"
    testAnnotationProcessor "org.projectlombok:lombok:1.18.48"

    localRuntime "me.djtheredstoner:DevAuth-fabric:1.2.2"
}

// include is not transitive, so every resolved library of `bundled` gets nested
afterEvaluate {
    configurations.bundled.resolvedConfiguration.resolvedArtifacts.each {
        def id = it.moduleVersion.id
        if (id.group == "org.slf4j") return // provided by minecraft
        dependencies.add("include", "${id.group}:${id.name}:${id.version}")
    }
}

// room editor is not part of the first 26.1 build
sourceSets.main.java {
    exclude "kr/syeyoung/dungeonsguide/mod/dungeon/roomedit/**"
    exclude "kr/syeyoung/dungeonsguide/mod/fakeserver/**"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/advanced/FeatureRoomEdit.java"
    // built on the room editor's MPanel
    exclude "kr/syeyoung/dungeonsguide/mod/gui/elements/CompatLayer.java"
    exclude "kr/syeyoung/dungeonsguide/mod/features/impl/party/playerpreview/datarenders/DataRendererEditor.java"
}

loom {
    accessWidenerPath = file("src/main/resources/dungeonsguide.classtweaker")

    runs {
        client {
            ideConfigGenerated = true
            name = "Launch Dungeons Guide"
            runDir = '../runtime'
            property('devauth.enabled', 'true')
            client()
        }
    }
}

ext.genOutputDir = layout.buildDirectory.dir("generated-resources").get().asFile
task generateVersionInfo {
    ext.outputFile = file("$genOutputDir/versionMeta.properties")
    outputs.file(outputFile)
    doLast {
        outputFile.text = "VERSION=${project.version}\nMANDATORY_VERSION=0"
    }
}
sourceSets.main.output.dir genOutputDir, builtBy: generateVersionInfo

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    // the port is compile error driven, show all of them
    options.compilerArgs += ["-Xmaxerrs", "100000"]
}

signing {
    required(project.findProperty("dg.dosign") == "true")
    useGpgCmd()
    sign tasks.jar
}

artifacts {
    remappedMod(tasks.jar)
    unmappedMod(tasks.jar)
}
